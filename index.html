<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SM home dekor Planner</title>
<meta name="description" content="Rendelésnapló, kiadások, haszon és NAV bevételi kimutatás az SM home dekor makramé vállalkozáshoz.">
<meta name="theme-color" content="#b86f76" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#211a1b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="smhd-shell" content="2.7">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SM Planner">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Mulish:wght@400;600;700;800&display=swap">
<style>
/* Layout: egyoszlopos, mobilra szabott műhelynapló; felül csomózott zsinór-dísz, alul fix fülsor */
:root{
  --bg:#f5eee8; --surface:#fffaf7; --surface-2:#f9f2ec; --ink:#3b2c2a; --muted:#8a7470; --line:#e7d9d0;
  --rose:#b86f76; --rose-ink:#ffffff; --rose-soft:#f2dedd; --sage:#728f77; --sage-soft:#dfe8de;
  --cord:#cdb59c; --cord-soft:#efe4d8; --danger:#b04d4a; --danger-soft:#f6dcda; --warn-soft:#f7ead0; --late:#c27a26; --late-soft:#f6e1c6;
  --shadow:0 1px 2px rgba(80,50,40,.06),0 6px 18px rgba(80,50,40,.06);
  --f-display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --f-body:"Mulish","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#211a1b; --surface:#2c2324; --surface-2:#332829; --ink:#f3e6e0; --muted:#b6a09b; --line:#44373a;
  --rose:#e0a2a7; --rose-ink:#2b1d1f; --rose-soft:#4a3033; --sage:#a8c3aa; --sage-soft:#2e3c31;
  --cord:#8a735f; --cord-soft:#3a3029; --danger:#e88a85; --danger-soft:#4a2826; --warn-soft:#4a3d22; --late:#e3a55c; --late-soft:#4a3820;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 130px}
.num{font-variant-numeric:tabular-nums}

header.top{padding-block:18px 4px;display:flex;flex-direction:column;gap:2px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
.brand-row .top-tools{margin-left:auto}
.brand{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:clamp(28px,7.6vw,46px);line-height:1;letter-spacing:.01em;margin:0;white-space:nowrap;min-width:0}
@media (max-width:420px){.status{max-width:40vw;font-size:11px;padding:4px 8px}}
.brand span{color:var(--rose)}
.tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.top-tools{display:flex;gap:8px;align-items:center;flex:none}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status i{width:7px;height:7px;border-radius:50%;background:var(--cord);flex:none}
.status.ok i{background:var(--sage)} .status.local i{background:var(--cord)} .status.warn i{background:var(--rose)} .status.err i{background:var(--danger)}
.cord{display:block;width:100%;height:34px;margin-top:10px;color:var(--cord)}

.navrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-block:14px 12px}
.navrow h2{font-family:var(--f-display);font-weight:600;font-size:26px;margin:0;text-align:center;flex:1;text-wrap:balance}
.navrow h2.cap{text-transform:none}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.iconbtn:hover{border-color:var(--cord)}
.iconbtn svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.section-title{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0 0 10px}
.page-title{font-family:var(--f-display);font-weight:600;font-size:30px;margin:16px 0 4px;text-wrap:balance}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero .label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.hero .big{font-family:var(--f-display);font-size:clamp(40px,11vw,58px);font-weight:600;line-height:1.05;margin:4px 0 2px}
.hero .big.neg{color:var(--danger)}
.hero .eq{color:var(--muted);font-size:13px}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;border:10px double var(--cord-soft);pointer-events:none}
.progress{margin-top:14px}
.bar{height:10px;border-radius:999px;background:var(--cord-soft);overflow:hidden}
.bar > b{display:block;height:100%;background:var(--rose);border-radius:999px}
.progress small{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:6px;gap:8px;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}
.kpi .v{font-size:19px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .h{font-size:12px;color:var(--muted)}

.note{font-size:13px;color:var(--muted)}
.banner{border-radius:14px;padding:12px 14px;background:var(--rose-soft);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft)}

.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .l{min-width:0}
.row .r{text-align:right;flex:none}
.row b{font-weight:700}
.row .t{font-size:12px;color:var(--muted)}
.tap{cursor:pointer;border-radius:10px;padding-inline:6px}
.tap:hover{background:var(--surface-2)}

.order{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.order:hover{border-color:var(--cord)}
.order .name{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.order .price{font-weight:800;font-size:16px;text-align:right}
.order .meta{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.order .profit{font-size:13px;text-align:right;color:var(--sage);font-weight:700}
.order .profit.neg{color:var(--danger)}

.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--cord-soft);color:var(--ink)}
.pill.s0{background:var(--rose-soft)} .pill.s1{background:var(--cord-soft)} .pill.s2{background:var(--sage-soft)}
.chip-type{font-size:12px;font-weight:700;color:var(--rose)}

.catbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:6px 0}
.catbar .track{grid-column:1/-1;height:6px;border-radius:999px;background:var(--cord-soft);overflow:hidden}
.catbar .track b{display:block;height:100%;background:var(--sage)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:10px 18px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-size:14px;text-decoration:none}
.btn:hover{border-color:var(--cord)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--rose);color:var(--rose-ink);border-color:var(--rose)}
.btn.sage{background:var(--sage-soft);border-color:var(--sage-soft)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.danger.solid{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.wide{width:100%}
.btn.link{border:0;background:none;padding:6px 4px;color:var(--rose);text-decoration:underline}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;background:var(--rose);color:var(--rose-ink);border:0;box-shadow:0 8px 22px rgba(120,60,60,.28);display:grid;place-items:center;cursor:pointer;z-index:20}
.fab svg{width:26px;height:26px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);border-top:1px solid var(--line);z-index:30}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{background:none;border:0;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;min-width:0}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--rose)}

.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.c-grid{stroke:var(--line);stroke-width:1}
.c-zero{stroke:var(--muted);stroke-width:1}
.c-lab{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.c-lab.on{fill:var(--ink);font-weight:800}
.c-rev{fill:var(--rose)} .c-pro{fill:var(--sage)} .c-neg{fill:var(--danger)} .c-sel{fill:var(--cord-soft)} .c-hit{fill:transparent;cursor:pointer}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;font-weight:800;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.l,td.l{text-align:left}
th:first-child,td:first-child{padding-left:0}
td{text-align:right;padding:8px;border-bottom:1px dashed var(--line);white-space:nowrap;vertical-align:top}
td.tw{white-space:normal;min-width:130px}
tfoot td{font-weight:800;border-top:1px solid var(--ink);border-bottom:0}
td.miss{color:var(--danger);font-weight:700}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.in-ctl{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:16px}
.in-ctl:focus{border-color:var(--rose);outline:none;box-shadow:0 0 0 3px var(--rose-soft)}
textarea.in-ctl{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.preview{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--sage-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.preview b{font-weight:800}
.fieldset{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.fieldset legend{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:0 6px}

.daypick{position:relative;flex:1;text-align:center}
.daypick .lbl{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.15}
.daypick .lbl small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.daypick input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}

.set-row{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(3,minmax(0,1fr)) auto;gap:6px;align-items:end;padding:8px 0;border-bottom:1px dashed var(--line)}
.set-row.fixed{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.2fr) auto}
.set-row .in-ctl{padding:8px 10px;font-size:15px}
.set-head{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.06em}
@media (max-width:560px){
  .set-row{grid-template-columns:repeat(3,minmax(0,1fr)) auto}
  .set-row > .nm{grid-column:1/-1}
  .set-row.fixed{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}
  .set-row.fixed > .nt{grid-column:1/3}
}
.x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--muted);padding:0}
.x:hover{color:var(--danger);border-color:var(--danger-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--cord-soft);border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;font-weight:700}
.chip button{border:0;background:none;cursor:pointer;color:var(--muted);width:22px;height:22px;border-radius:50%;padding:0;display:grid;place-items:center}
.chip button:hover{color:var(--danger)}
.addline{display:flex;gap:8px;margin-top:10px}
.switch{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--rose);margin-top:2px;flex:none}

/* Dokumentumok */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.doc{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column;min-width:0}
.doc .thumb{aspect-ratio:4/3;max-width:100%;background:var(--cord-soft);display:grid;place-items:center;cursor:pointer;border:0;padding:0;width:100%;color:var(--muted)}
.doc .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.doc .thumb svg{width:34px;height:34px}
.doc .info{padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.doc .info b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .info span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .acts{display:flex;justify-content:flex-end;gap:6px;padding:0 8px 8px}

/* Kimutatás */
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;box-shadow:var(--shadow)}
.report h2{font-family:var(--f-display);font-weight:600;font-size:28px;margin:0;text-wrap:balance}
.rep-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:12px}
.rep-id{font-size:13px;line-height:1.55}
.rep-id b{font-size:15px}
.rep-meta{text-align:right;font-size:12px;color:var(--muted)}
.rep-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-block:14px}
.rep-sum div{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rep-sum small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.rep-sum b{font-size:18px}
.rep-foot{margin-top:14px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Belépés */
.auth{max-width:420px;margin:24px auto 0}
.auth h2{font-family:var(--f-display);font-weight:600;font-size:30px;margin:0}
.qr{display:grid;place-items:center;padding:14px;background:#fff;border-radius:14px;width:max-content;max-width:100%;margin-inline:auto}
.qr svg,.qr img{display:block;width:220px;height:220px;max-width:100%}
.copyline{display:flex;gap:8px;align-items:center}
.copyline code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}

.overlay{position:fixed;inset:0;background:rgba(40,25,25,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:22px;max-height:88%}}
.sheet h3{font-family:var(--f-display);font-size:28px;font-weight:600;margin:0}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.empty{text-align:center;padding:26px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{font-family:var(--f-display);font-size:26px;font-weight:600;margin:0}
.empty p{margin:0;color:var(--muted);max-width:40ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:60;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet.anim{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}


/* Naptár és rendelésállapot */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;font-weight:800;color:var(--muted);text-align:center;padding:2px 0 4px;letter-spacing:.04em}
.cal .d{aspect-ratio:1/1.08;max-width:100%;min-width:0;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 2px 5px;cursor:pointer;color:var(--ink)}
.cal .d .n{font-size:11px;color:var(--muted);font-weight:700;align-self:flex-start;padding-left:4px;line-height:1.2}
.cal .d .c{font-size:17px;font-weight:800;line-height:1}
.cal .d .dots{display:flex;gap:2px;height:6px}
.cal .d .dots i,.legend i[class^="dot-"]{width:6px;height:6px;border-radius:50%;display:inline-block}
.legend i[class^="dot-"]{width:10px;height:10px;margin-right:5px}
.cal .d.st-done{background:var(--sage-soft);border-color:transparent}
.cal .d.st-open{background:var(--cord-soft);border-color:transparent}
.cal .d.st-unpaid{background:var(--danger-soft);border-color:transparent}
.cal .d.st-late{background:var(--late-soft);border-color:transparent}
.cal .d.today .n{color:var(--ink);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.cal .d.sel{outline:2px solid var(--rose);outline-offset:1px}

/* Törlés gomb a kártyán, visszavonás */

.toast.has-act{display:flex;align-items:center;gap:12px;padding-right:8px}
.toast button{border:0;background:var(--rose);color:var(--rose-ink);font-weight:800;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
/* Készlet */

.qty{display:flex;align-items:center;gap:8px}

/* 2.3: menü, Új rendelés, Több, Motiváció, Rajztábla */
nav.tabs .tab-new{color:var(--rose)}

.more-tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;box-shadow:var(--shadow);min-width:0}

.more-tile b{font-size:15px}
.sheet.inline{max-height:none;overflow:visible;padding:0;border-radius:0;background:none;animation:none}
.btn.big{padding:14px 26px;font-size:16px}
.type-chips{gap:8px}
.tchip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer}

details.more{border:1px dashed var(--line);border-radius:14px;padding:12px}
details.more summary{cursor:pointer;font-weight:800;list-style:revert}
.hero.quote .q{font-family:var(--f-display);font-style:italic;font-size:clamp(24px,6.5vw,32px);line-height:1.25;margin:8px 0 0;text-wrap:balance}
textarea.why{min-height:160px;font-size:16px;line-height:1.55}
.goal{align-items:center}
.goal.done span{text-decoration:line-through;color:var(--muted)}
.mnote{white-space:pre-wrap;overflow-wrap:anywhere}
.range{width:100%;accent-color:var(--rose)}
.draw-tools{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.pens{display:flex;gap:8px;flex-wrap:wrap}
.pen{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.pen.on{outline:3px solid var(--ink);outline-offset:2px}
.size{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;padding:0}

.size.on{border-color:var(--rose);box-shadow:0 0 0 2px var(--rose-soft)}
.draw-host{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fffaf4}
canvas.pad{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}


/* 2.5: átdolgozott menü, egyértelmű gombok, árukészlet */
.btn{min-height:44px}
.btn.small{min-height:36px}
.btn.link{min-height:0}
.iconbtn{width:44px;height:44px}
nav.tabs{box-shadow:0 -4px 18px rgba(80,50,40,.06)}
nav.tabs button{padding:8px 2px 8px;font-size:11.5px;gap:4px;min-height:62px}

nav.tabs button svg{width:23px;height:23px}

nav.tabs button[aria-current="page"] .ic{background:var(--rose-soft);color:var(--rose)}
nav.tabs button[aria-current="page"] span:last-child{font-weight:800}
nav.tabs .tab-new .new-dot{width:52px;height:52px;margin-top:-26px;border:4px solid var(--surface)}
nav.tabs .tab-new .new-dot svg{width:26px;height:26px}
.fab{width:auto;height:52px;border-radius:999px;padding:0 20px 0 16px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px}
.fab svg{width:22px;height:22px}
.backbar{margin-top:12px}
.back{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px 8px 10px;font-weight:800;font-size:14px;cursor:pointer;min-height:40px;color:var(--ink)}
.back svg{width:18px;height:18px}
.more-group{margin-top:18px}
.more-group:first-of-type{margin-top:6px}
.more-tile{min-height:112px}
.more-tile .mi{width:44px;height:44px}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.qa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 6px;min-height:92px;border-radius:16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800;font-size:13.5px;text-align:center;box-shadow:var(--shadow);color:var(--ink)}
.qa .mi{width:40px;height:40px;border-radius:12px;background:var(--rose-soft);color:var(--rose);display:grid;place-items:center}
.qa .mi svg{width:22px;height:22px}
.qa .mi,.more-tile .mi{flex:none}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.k3 .kpi{padding:10px 10px}
.kpis.k3 .kpi .v{font-size:16px}
.kpis.k3 .kpi .k{font-size:10px;letter-spacing:.06em}
.qa.sage .mi{background:var(--sage-soft);color:var(--sage)}
.qa.cord .mi{background:var(--cord-soft);color:var(--ink)}
.choose{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choose .qa{min-height:120px;font-size:15px;align-items:flex-start;text-align:left;padding:16px}
.choose .qa .note{font-weight:600;font-size:12.5px}
/* Árukészlet */
.add2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.addbig{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;border-radius:16px;border:0;background:var(--rose);color:var(--rose-ink);font-weight:800;font-size:15.5px;cursor:pointer;box-shadow:0 6px 16px rgba(120,60,60,.18);padding:10px}
.addbig.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}

.catchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}

.toolrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.pgroup h3{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin:0 0 8px}
.pgroup h3 .cnt{font-size:12px;color:var(--muted);font-weight:700}
.pgroup h3.letter{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.pcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;padding:0;cursor:pointer;text-align:left;min-width:0;position:relative;color:var(--ink);box-shadow:var(--shadow)}

.pcard .pinfo{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pcard .pinfo b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pmeta{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.famchips{display:flex;flex-wrap:wrap;gap:6px}
.famchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px 6px 8px;font-weight:700;font-size:13px;cursor:pointer;min-height:36px;color:var(--ink)}
.famchip.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.newrows{display:flex;flex-direction:column;gap:10px}

.colorline{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;flex-wrap:wrap}

.prod-hero{width:100%;max-height:34vh;object-fit:contain;border-radius:14px;background:var(--cord-soft);display:block;cursor:zoom-in}

/* 2.6: polcos árukészlet, nagy képek, hibamagyarázat */
.sheet{max-height:92dvh}

.sheet-head .note{margin-top:2px}
.sticky-save{position:sticky;bottom:0;margin:4px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:center;z-index:3}
.sticky-save .btn.primary{flex:1}
.prod-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.statline{font-size:13px;color:var(--muted);font-weight:700}
.tchip.ghost{background:none;border-style:dashed;color:var(--muted)}
.toolrow .seg button{min-height:38px;padding:6px 14px}
.ghead{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin:0;padding:10px 2px 8px}
.ghead .cnt{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.ghead.letter{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1}
.pgroup{margin-top:6px}
/* Polc */
.shelf{margin:4px 0 22px}
.shelf-row{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:10px;padding:0 8px;align-items:end}
.plank{height:12px;margin-top:2px;border-radius:4px;background:linear-gradient(180deg,#e3cdb1 0,#c9a984 55%,#a9876a 100%);box-shadow:0 8px 12px -6px rgba(70,40,20,.45),inset 0 1px 0 rgba(255,255,255,.5)}

.pcard{display:flex;flex-direction:column;border:0;background:none;box-shadow:none;border-radius:0;overflow:visible;padding:0;cursor:pointer;text-align:left;min-width:0;position:relative;color:var(--ink)}
.pcard .pph{position:relative;aspect-ratio:1/1;width:100%;border-radius:12px;overflow:hidden;background:var(--cord-soft);display:grid;place-items:center;color:var(--muted);box-shadow:0 2px 4px rgba(60,35,25,.12),0 8px 16px -6px rgba(60,35,25,.25);transition:transform .15s}
.pcard:active .pph{transform:scale(.97)}
.pcard .pph img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .noimg svg{width:26px;height:26px}
.pcard .pinfo{padding:6px 2px 4px;display:flex;flex-direction:column;gap:1px;min-width:0}
.pcard .pinfo b{font-size:12.5px;line-height:1.25;font-weight:800;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal}
.pcard .pmeta{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:4px;min-width:0}
.pcard .pmeta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .pmeta .sw{width:10px;height:10px}
.pcard .pprice{font-size:12px;font-weight:800}
.pcard .badge{position:absolute;top:6px;right:6px;background:rgba(30,20,20,.72);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:2px 7px;min-width:22px;text-align:center}
.pcard .badge.zero{background:var(--danger)}
/* Rács */
.pgrid.tight{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:4px;margin-bottom:12px}
.pgrid.tight .pph{border-radius:6px;box-shadow:none}

/* Színválasztó */
.shades{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:7px}
.shade{aspect-ratio:1/1;width:100%;border-radius:50%;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0;min-height:34px}
.shade.tarka{background:conic-gradient(#d23b3b,#e9c93c,#5d9a5b,#3f6fc4,#8a5bc0,#d23b3b)!important}
.shade.on{outline:3px solid var(--ink);outline-offset:2px}
/* Új termék kártyák */
.ncards{display:flex;flex-direction:column;gap:14px}
.ncard{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface-2)}
.ncard.bad{border:0;background:none}
.nimg{position:relative;aspect-ratio:4/3;background:#1d1616}
.nimg img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.nx{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(20,12,12,.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.nbadges{position:absolute;left:10px;bottom:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap}
.nbadge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,252,249,.94);color:#3b2c2a;border:0;border-radius:999px;padding:6px 12px 6px 8px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.nsub{padding:10px 12px 0}
.nbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.nrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:end}
.nbody .in-ctl,.nrow .in-ctl{padding:9px 10px}
.nrow .lbl{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.step button{width:40px;height:40px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
.step button svg{width:16px;height:16px}
.step b{min-width:30px;text-align:center;font-size:15px}
.dot-spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--rose-soft);border-top-color:var(--rose);animation:spin .8s linear infinite;display:inline-block}
/* Termék adatlap */
.hero-img{position:relative;border-radius:16px;overflow:hidden;background:#1d1616;display:grid;place-items:center;min-height:200px}

details.more summary{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
/* Hibák */
.errbox{background:var(--danger-soft);border-left:4px solid var(--danger);border-radius:12px;padding:12px 14px;font-size:14px}

.errbox code{display:block;white-space:pre-wrap;word-break:break-word;margin-top:4px}
.errbox .btns{margin-top:8px;justify-content:space-between}
.aihint{border-style:dashed}
.colorjump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.colorjump::-webkit-scrollbar{display:none}
.colorjump button{flex:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px 5px 6px;font-size:12px;font-weight:800;cursor:pointer;color:var(--ink);min-height:34px}
.shelf-mark{scroll-margin-top:12px}


/* 2.7: folyamatjelző, görgetőcsúszka, gyorsabb görgetés, táblagép */
.pgrid2>div+div{margin-top:12px}
@media (min-width:900px){.pgrid2>div+div{margin-top:0}}
.pbar{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.pbar-top{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700;margin-bottom:6px}
.pbar-top b{color:var(--rose);font-size:15px}
.pbar-track{height:8px;border-radius:999px;background:var(--cord-soft);overflow:hidden}
.pbar-track b{display:block;height:100%;background:var(--rose);border-radius:999px;transition:width .25s}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.shelf,.pgroup{content-visibility:auto;contain-intrinsic-size:auto 220px}
.ncard{content-visibility:auto;contain-intrinsic-size:auto 520px}
.fs{position:fixed;width:30px;z-index:70;pointer-events:none}
.fs[hidden]{display:none}
.fs-thumb{position:absolute;right:0;top:0;width:30px;display:flex;justify-content:flex-end;pointer-events:auto;touch-action:none;cursor:grab;padding-right:3px}
.fs-thumb i{display:block;width:6px;height:100%;border-radius:999px;background:var(--muted);opacity:.45;transition:opacity .2s,width .15s}
.fs.on .fs-thumb i{opacity:.75}
.fs.drag .fs-thumb i{width:10px;opacity:1;background:var(--rose)}
.fs-bubble{position:absolute;right:38px;top:0;white-space:nowrap;background:var(--ink);color:var(--bg);font-weight:800;font-size:14px;padding:7px 14px;border-radius:999px;box-shadow:var(--shadow)}
@media (hover:hover){.sheet::-webkit-scrollbar{width:10px}.sheet::-webkit-scrollbar-thumb{background:var(--cord);border-radius:999px}}
/* Táblagép (fektetve) és nagy képernyő */
@media (min-width:700px){
  .wrap{max-width:980px;padding-inline:24px}
  .sheet.wide{max-width:920px}
  .ncards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .more-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .choose{grid-template-columns:repeat(4,minmax(0,1fr))}
  .sheet{max-width:720px}
  .fab{right:calc(50% - 466px)}
}
@media (min-width:900px){
  nav.tabs{top:0;bottom:0;right:auto;width:96px;border-top:0;border-right:1px solid var(--line);padding:0;box-shadow:4px 0 18px rgba(80,50,40,.05);display:flex;align-items:center}
  nav.tabs .in{display:flex!important;flex-direction:column;gap:6px;width:100%;max-width:none}
  nav.tabs button{min-height:72px}
  nav.tabs .tab-new .new-dot{margin-top:0}
  body{padding-left:96px}
  .wrap{max-width:1240px;padding-bottom:60px}
  .toast{bottom:28px;margin-left:48px}
  .fab{bottom:28px;right:28px}
  .kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
  .quick{max-width:720px}
  .ncards{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sheet.wide{max-width:1100px}
  .sheet.full.prodsheet{max-width:1000px}
  .prodsheet .pgrid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
  .prodsheet .hero-img img{max-height:70dvh}
}

/* Nyomtatás: csak a kimutatás */
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#444;--line:#999;color-scheme:light}
  @page{size:A4;margin:14mm}
  body{font-size:11pt}
  header.top,nav.tabs,.fab,.noprint,#toast,#sheet,#modal,#viewer{display:none!important}
  .wrap{max-width:none;padding:0}
  .report{border:0;box-shadow:none;padding:0}
  .table-wrap{overflow:visible}
  table{font-size:9.5pt}
  td,th{padding:4px 5px}
  tr{break-inside:avoid}
}
</style>
</head>
